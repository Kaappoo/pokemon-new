name: Sync card catalog

# Keeps the series/sets/cards tables in Neon up to date with TCGdex.
# See docs/adr/0002-synced-catalog.md.

on:
  schedule:
    # 03:00 UTC nightly. GitHub may delay scheduled runs a little; that's fine.
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    # The first backfill enriches 20k+ cards one by one; nightly runs take minutes.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        env:
          # Must be the direct (unpooled) Neon connection string.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate
      - name: Run catalog sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sync
